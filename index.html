<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Chase Kart · Retro Circuit</title><style>*{box-sizing:border-box}body{margin:0;background:#080e21;color:white;font-family:system-ui;font-weight:800;overflow:hidden;touch-action:none}canvas{width:100vw;height:100dvh;display:block;image-rendering:pixelated}#menu{position:fixed;inset:0;background:#0b1534ef;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;gap:12px;padding:18px}h1{font-size:clamp(30px,8vw,62px);color:#ffe85e;text-shadow:4px 4px #b32e2e;margin:0}#start{background:#e95639;padding:14px 35px}button{touch-action:none;border:3px solid white;border-radius:12px;background:#244d9c;color:white;font-size:19px;font-weight:900;min-height:55px}#buttons{display:none;position:fixed;bottom:6px;left:6px;right:6px;justify-content:space-between;pointer-events:none}#buttons button{pointer-events:auto;width:64px;opacity:.85}#buttons .gas{background:#178c50;width:83px}#buttons .brake{background:#b8413d;width:75px}small{opacity:.8}#turn{position:fixed;top:0;right:0;background:#000a;padding:4px;font-size:11px;display:none}</style></head><body><canvas id="screen"></canvas><div id="buttons"><div><button data-key="left">◀</button><button data-key="right">▶</button></div><div><button data-key="brake" class="brake">BREMSE</button><button data-key="gas" class="gas">GAS</button></div></div><div id="turn">Querformat empfohlen ↻</div><div id="menu"><h1>🐾 CHASE KART</h1><div>RETRO CIRCUIT · MODE-7-INSPIRIERT</div><p id="message">Eine kurvenreiche Rennstrecke, 3 Runden und fünf Rivalen.</p><button id="start">🏁 RENNEN STARTEN</button><small>Steuern: ◀ ▶ · GAS · BREMSE</small></div><script>
(()=>{'use strict';const C=document.querySelector('#screen'),g=C.getContext('2d',{alpha:false}),menu=document.querySelector('#menu'),btn=document.querySelector('#buttons'),start=document.querySelector('#start'),message=document.querySelector('#message'),turn=document.querySelector('#turn');const mw=512,mh=512;const map=document.createElement('canvas');map.width=mw;map.height=mh;const m=map.getContext('2d',{willReadFrequently:true});const track=[];for(let i=0;i<240;i++){let a=i*Math.PI*2/240;track.push({x:256+175*Math.cos(a)+23*Math.sin(3*a),y:256+154*Math.sin(a)+15*Math.cos(2*a)})}function stroke(width,color){m.strokeStyle=color;m.lineWidth=width;m.lineJoin='round';m.lineCap='round';m.beginPath();track.forEach((p,i)=>i?m.lineTo(p.x,p.y):m.moveTo(p.x,p.y));m.closePath();m.stroke()}m.fillStyle='#4baf5b';m.fillRect(0,0,512,512);for(let y=0;y<512;y+=16)for(let x=0;x<512;x+=16){m.fillStyle=(x/16+y/16)%2?'#4da85c':'#52b15d';m.fillRect(x,y,16,16)}stroke(80,'#ddd5bb');stroke(72,'#c94942');stroke(64,'#f6f1df');stroke(59,'#70747d');stroke(53,'#777c83');for(let i=0;i<track.length;i+=8){let p=track[i],q=track[(i+1)%track.length],dx=q.x-p.x,dy=q.y-p.y,len=Math.hypot(dx,dy),nx=-dy/len,ny=dx/len;m.strokeStyle=i%16?'#f4f2d9':'#f3c55e';m.lineWidth=2;m.beginPath();m.moveTo(p.x-nx*1,p.y-ny*1);m.lineTo(p.x+nx*1,p.y+ny*1);m.stroke()}let p0=track[0],p1=track[1],ang=Math.atan2(p1.y-p0.y,p1.x-p0.x);m.save();m.translate(p0.x,p0.y);m.rotate(ang);for(let x=-26;x<26;x+=7)for(let y=-5;y<5;y+=5){m.fillStyle=((x/7+y/5)&1)?'#fff':'#171717';m.fillRect(x,y,7,5)}m.restore();const rand=(n)=>{let v=Math.sin(n*78.23)*12453;return v-Math.floor(v)};for(let i=0;i<120;i++){let x=rand(i+3)*512,y=rand(i+456)*512;let nearest=1e9;for(let j=0;j<240;j+=3){let p=track[j];nearest=Math.min(nearest,(x-p.x)**2+(y-p.y)**2)}if(nearest<2500)continue;m.fillStyle='#286d37';m.fillRect(x-5,y-4,11,10);m.fillStyle='#226431';m.fillRect(x-2,y-8,8,9);m.fillStyle='#6bc66c';m.fillRect(x-4,y-8,4,4)}const pixels=m.getImageData(0,0,512,512).data;const rw=320,rh=180,buffer=document.createElement('canvas');buffer.width=rw;buffer.height=rh;const bg=buffer.getContext('2d');let image=bg.createImageData(rw,rh);let W=0,H=0,active=false,lap=1,lastIndex=0,completed=0,seconds=0,spd=0,off=0,heading=0,carX=0,carY=0,last=0;const keys={gas:false,brake:false,left:false,right:false};function reset(){let p=track[0],q=track[1];carX=p.x;carY=p.y;heading=Math.atan2(q.y-p.y,q.x-p.x);spd=0;lap=1;completed=0;seconds=0;off=0;lastIndex=0;active=true;menu.style.display='none';btn.style.display='flex'}function resize(){W=C.width=innerWidth;H=C.height=innerHeight;turn.style.display=W<H?'block':'none'}addEventListener('resize',resize);resize();start.onclick=reset;document.querySelectorAll('[data-key]').forEach(el=>{let k=el.dataset.key;el.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;el.setPointerCapture(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(t=>el.addEventListener(t,()=>keys[k]=false))});const keyMap={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'gas',ArrowDown:'brake',' ':'gas'};addEventListener('keydown',e=>{if(keyMap[e.key]){keys[keyMap[e.key]]=true;e.preventDefault()}});addEventListener('keyup',e=>{if(keyMap[e.key])keys[keyMap[e.key]]=false});function nearest(){let best=Infinity,index=0;for(let i=0;i<240;i++){let p=track[i],d=(carX-p.x)**2+(carY-p.y)**2;if(d<best){best=d;index=i}}return {index,dist:Math.sqrt(best)}}function update(dt){seconds+=dt;let n=nearest();off=n.dist>30;if(keys.gas)spd+=dt*38;else spd-=dt*18;if(keys.brake)spd-=dt*65;spd=Math.max(-8,Math.min(75,spd));if(off)spd=Math.min(spd,32);heading+=((keys.right?1:0)-(keys.left?1:0))*dt*(.75+Math.abs(spd)*.025)*(spd>=0?1:-1);carX+=Math.cos(heading)*spd*dt;carY+=Math.sin(heading)*spd*dt;carX=Math.max(3,Math.min(509,carX));carY=Math.max(3,Math.min(509,carY));if(lastIndex>205&&n.index<30&&spd>5){completed++;lap++;if(completed>=3){active=false;btn.style.display='none';menu.style.display='flex';message.textContent='🏆 Ziel erreicht! Zeit: '+seconds.toFixed(1)+' Sekunden';start.textContent='NOCHMAL SPIELEN'}}lastIndex=n.index}function rect(x,y,w,h,color){g.fillStyle=color;g.fillRect(x,y,w,h)}function draw(){const upper=Math.round(H*.65),sky=upper*.27;rect(0,0,W,H,'#14213d');rect(0,0,W,sky,'#87c6f1');rect(0,sky,W,upper-sky,'#9fc9d3');for(let i=0;i<12;i++){let x=(i*137+W*.1)%W;rect(x,sky-20-(i%3)*8,55,24+(i%3)*8,'#6b9f7a');rect(x+12,sky-33-(i%3)*8,28,15,'#4b8b6d')}let data=image.data;const sin=Math.sin(heading),cos=Math.cos(heading);for(let y=0;y<rh;y++){let perspective=1/(.15+y/rh*1.9),dist=perspective*95,half=dist*1.1;for(let x=0;x<rw;x++){let side=(x/rw-.5)*half,wx=Math.floor(carX+cos*dist-sin*side),wy=Math.floor(carY+sin*dist+cos*side),k=(y*rw+x)*4;if(wx>=0&&wy>=0&&wx<512&&wy<512){let s=(wy*512+wx)*4;data[k]=pixels[s];data[k+1]=pixels[s+1];data[k+2]=pixels[s+2]}else{data[k]=68;data[k+1]=150;data[k+2]=74}data[k+3]=255}}bg.putImageData(image,0,0);g.imageSmoothingEnabled=false;g.drawImage(buffer,0,sky,W,upper-sky);let scale=Math.min(W/500,upper/260)*1.25,cx=W*.5,cy=upper*.83;g.save();g.translate(cx,cy);g.scale(scale,scale);rect(-25,-5,13,36,'#242a35');rect(12,-5,13,36,'#242a35');rect(-22,0,44,28,'#124cb0');rect(-17,4,34,15,'#3485dc');rect(-13,-22,26,25,'#bd865b');rect(-16,-26,32,13,'#214f9b');rect(-11,-34,9,15,'#8a5a39');rect(2,-34,9,15,'#8a5a39');rect(-10,-10,20,5,'#e5bd83');rect(-8,-22,6,6,'#f7f7f7');rect(3,-22,6,6,'#f7f7f7');rect(-6,-30,12,6,'#ffdf55');rect(-20,21,40,10,'#193b78');g.restore();rect(0,upper,W,3,'#fff');rect(0,upper+3,W,H-upper-3,'#101831');let size=Math.min(H-upper-12,W*.32),mx=(W-size)/2,my=upper+7;g.drawImage(map,0,0,512,512,mx,my,size,size);let dotx=mx+carX/512*size,doty=my+carY/512*size;rect(dotx-3,doty-3,7,7,'#ffde39');for(let i=0;i<5;i++){let q=track[(Math.floor(seconds*(10+i*.9))+i*40)%240];rect(mx+q.x/512*size-2,my+q.y/512*size-2,5,5,['#e54a43','#e6d74a','#fa99ce','#9c82ee','#75dcff'][i])}g.fillStyle='#fff';g.font='bold '+Math.max(12,Math.min(24,W*.032))+'px monospace';g.fillText('CHASE KART',12,upper+29);g.fillText('LAP '+Math.min(lap,3)+'/3',12,upper+55);g.fillText(Math.round(Math.max(0,spd)*2)+' km/h',12,upper+80);g.fillText(seconds.toFixed(1)+' s',12,upper+105);g.fillText('RETRO CIRCUIT',W-Math.min(180,W*.29),upper+30)}function frame(t){let dt=Math.min(.05,(t-last)/1000||0);last=t;if(active)update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame)})();
</script></body></html>
