<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#152b53"><title>Chase Kart – Pixel Cup</title><style>*{box-sizing:border-box}body{margin:0;background:#10203b;color:white;font:700 16px system-ui;overflow:hidden;touch-action:none}canvas{display:block;width:100vw;height:100dvh;image-rendering:pixelated}#ui{position:fixed;inset:0;pointer-events:none}button{pointer-events:auto;border:3px solid #fff;border-radius:14px;background:#174b98d9;color:white;font-weight:900;font-size:20px;touch-action:none}#menu{position:absolute;inset:0;background:#10203be9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:15px}#menu h1{font-size:clamp(27px,7vw,56px);margin:0;color:#ffd84e;text-shadow:3px 3px #bd3e28}#menu p{max-width:460px;margin:4px}#start{padding:15px 35px;background:#ed8c24}#controls{position:absolute;bottom:12px;left:12px;right:12px;display:none;justify-content:space-between;align-items:end}#controls button{width:68px;height:65px;opacity:.82}#controls .gas{width:100px;height:76px;background:#168a49}#controls .brake{background:#b23c40}#hud{position:absolute;top:8px;left:12px;font-size:clamp(12px,3vw,19px);text-shadow:2px 2px #000;display:none}#tip{position:absolute;top:8px;right:12px;font-size:12px;display:none}</style></head><body><canvas id="game"></canvas><div id="ui"><div id="hud"></div><div id="tip">CHASE 🐾</div><div id="controls"><div><button data-k="left">◀</button><button data-k="right">▶</button></div><div><button class="brake" data-k="brake">BREMSE</button> <button class="gas" data-k="gas">GAS</button></div></div><div id="menu"><h1>🐾 CHASE KART</h1><p>PIXEL CUP · 3 Strecken · 5 Gegner · Meisterschaft</p><p id="message">Hilf Chase, den Pokal zu gewinnen!</p><button id="start">🏁 RENNEN STARTEN</button><small>Querformat empfohlen · Touch-Steuerung</small></div></div><script>
(()=>{'use strict';const c=document.getElementById('game'),ctx=c.getContext('2d'),menu=document.getElementById('menu'),start=document.getElementById('start'),msg=document.getElementById('message'),hud=document.getElementById('hud'),controls=document.getElementById('controls'),tip=document.getElementById('tip');let W=0,H=0,playing=false,stage=0,t=0,last=0,progress=0,speed=0,lateral=0,points=0,finished=false;const keys={left:false,right:false,gas:false,brake:false},tracks=[{name:'Abenteuerbucht',sky:'#8bd6ff',ground:'#56a854',road:'#69676b',curve:0.65},{name:'Sonnenstrand',sky:'#ffd5a0',ground:'#eac46c',road:'#807e7d',curve:0.95},{name:'Bergrettung',sky:'#b8d6ee',ground:'#6a956e',road:'#55575e',curve:1.35}];function resize(){W=c.width=innerWidth;H=c.height=innerHeight}addEventListener('resize',resize);resize();document.querySelectorAll('[data-k]').forEach(b=>{let k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;b.setPointerCapture(e.pointerId)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>keys[k]=false)});const map={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'gas',ArrowDown:'brake',' ':'gas'};addEventListener('keydown',e=>{if(map[e.key]){keys[map[e.key]]=true;e.preventDefault()}});addEventListener('keyup',e=>{if(map[e.key])keys[map[e.key]]=false});start.onclick=()=>{if(stage>=3){stage=0;points=0}progress=0;speed=0;lateral=0;t=0;finished=false;playing=true;menu.style.display='none';controls.style.display='flex';hud.style.display='block';tip.style.display='block';last=performance.now()};function rect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(x,y,w,h)}function poly(a,color){ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(a[0][0],a[0][1]);for(let i=1;i<a.length;i++)ctx.lineTo(a[i][0],a[i][1]);ctx.closePath();ctx.fill()}function kart(x,y,scale,color,police){ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);rect(-19,-12,38,31,'#171d27');rect(-14,-9,28,25,color);rect(-11,-17,22,16,police?'#b8874c':'#d9ac7c');rect(-10,-21,20,7,police?'#1749ae':'#f0df50');rect(-14,-1,28,5,'#dce7f3');rect(-20,7,8,11,'#202020');rect(12,7,8,11,'#202020');if(police){rect(-4,-25,8,6,'#ffd749');rect(-6,-11,12,5,'#ffe36c')}ctx.restore()}function draw(){const tr=tracks[Math.min(stage,2)],horizon=H*.39;rect(0,0,W,horizon,tr.sky);rect(0,horizon,W,H-horizon,tr.ground);const hill=H*.1;for(let i=0;i<7;i++){let x=i*W/5-W*.15;poly([[x,horizon],[x+W*.12,horizon-hill*(.6+i%3*.2)],[x+W*.25,horizon]],stage===2?'#8babb4':'#65a56d')}for(let i=0;i<90;i++){let z=i/90,y=horizon+(H-horizon)*z*z,depth=(1-z),curve=Math.sin(progress*.014+depth*4)*tr.curve*W*.19+Math.sin(progress*.007+depth*8)*W*.06,center=W/2+curve-lateral*W*.27*z,half=(W*.055+W*.49*z);let next=(i+1)/90,yn=horizon+(H-horizon)*next*next,curve2=Math.sin(progress*.014+(1-next)*4)*tr.curve*W*.19+Math.sin(progress*.007+(1-next)*8)*W*.06,cn=W/2+curve2-lateral*W*.27*next,hn=W*.055+W*.49*next;poly([[center-half-12*z,y],[center+half+12*z,y],[cn+hn+12*next,yn],[cn-hn-12*next,yn]],Math.floor((i+progress*.6)/6)%2?'#fff':'#e54c40');poly([[center-half,y],[center+half,y],[cn+hn,yn],[cn-hn,yn]],tr.road);if(Math.floor((i+progress*.8)/8)%2===0){let sw=half*.035;poly([[center-sw,y],[center+sw,y],[cn+hn*.035,yn],[cn-hn*.035,yn]],'#ffe69b')}}for(let j=0;j<5;j++){let d=((j*127+progress*.72)%550)/550,depth=1-d,z=depth,y=horizon+(H-horizon)*z*z;if(z<.13||z>.88)continue;let curve=Math.sin(progress*.014+d*4)*tr.curve*W*.19+Math.sin(progress*.007+d*8)*W*.06,center=W/2+curve-lateral*W*.27*z,half=W*.055+W*.49*z;let lane=Math.sin(j*8.2+progress*.002)*.64;kart(center+half*lane,y,Math.max(.25,z*1.4),['#f24a4a','#e6b32c','#f69cde','#5bb7ed','#8c63d5'][j],false)}kart(W*.5,H*.81,Math.max(1,Math.min(W,H)/280),'#1960ce',true);rect(0,H-5,W,5,'#13243b')}function frame(now){let dt=Math.min(.05,(now-last)/1000||0);last=now;if(playing){t+=dt;speed+=((keys.gas?1:0)-(keys.brake?1.8:0)-(!keys.gas?.28:0))*dt*.9;speed=Math.max(0,Math.min(1,speed));lateral+=((keys.right?1:0)-(keys.left?1:0))*dt*(.65+speed*.8);lateral-=Math.sin(progress*.014)*tracks[stage].curve*speed*dt*.18;lateral=Math.max(-2,Math.min(2,lateral));if(Math.abs(lateral)>1.15)speed=Math.max(.15,speed-dt*.7);progress+=speed*dt*36;draw();let lap=Math.min(3,Math.floor(progress/350)+1),pct=Math.min(100,Math.floor((progress%350)/3.5));hud.textContent=tracks[stage].name+' · Runde '+lap+'/3 · '+Math.floor(speed*140)+' km/h · '+pct+'%';if(progress>=1050&&!finished){finished=true;playing=false;points+=10;controls.style.display='none';hud.style.display='none';tip.style.display='none';menu.style.display='flex';stage++;msg.textContent=stage<3?'Strecke geschafft! 10 Punkte · Gesamt '+points+' Punkte':'🏆 Chase gewinnt den Pixel Cup! '+points+' Punkte';start.textContent=stage<3?'NÄCHSTE STRECKE ▶':'NOCHMAL SPIELEN ↻'}}requestAnimationFrame(frame)}requestAnimationFrame(frame)})();
</script></body></html>
